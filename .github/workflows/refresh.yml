name: refresh-data

on:
  schedule:
    # Setiap hari 01:15 UTC (08:15 WIB) — SKB bisa terbit/diubah kapan saja.
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Paksa ambil ulang semua sumber"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTO_REFRESH: "false"
      FETCH_DELAY_MS: "400"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pengujian (tidak memblokir refresh data)
        # Data yang basi lebih berbahaya daripada test yang gagal, jadi kegagalan
        # test tidak menghentikan pemutakhiran; statusnya tetap dilaporkan di bawah.
        continue-on-error: true
        run: npm test

      - name: Perbarui data dari sumber resmi
        run: node src/scripts/refresh.js --force

      - name: Siapkan dataset tahun berikutnya bila belum ada
        # Tahun baru tetap punya jawaban (status draft + tentative) walau SKB belum terbit.
        run: |
          NEXT_YEAR=$(( $(date -u +%Y) + 1 ))
          if [ ! -f "data/skb/$NEXT_YEAR.json" ]; then
            node src/scripts/new-year.js --year "$NEXT_YEAR" --write
          else
            echo "data/skb/$NEXT_YEAR.json sudah ada, dilewati."
          fi

      - name: Ringkasan hasil
        run: |
          node src/scripts/report.js > refresh-report.md
          cat refresh-report.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            cat refresh-report.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Kirim notifikasi bila ada masalah
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "ALERT_WEBHOOK_URL belum diset; notifikasi dilewati."
            exit 0
          fi
          node src/scripts/alert.js refresh-report.md "$ALERT_WEBHOOK_URL"

      - name: Commit perubahan data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache data/skb
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "chore(data): perbarui data SKB hari libur $(date -u +%Y-%m-%d)"
            git push
          fi
